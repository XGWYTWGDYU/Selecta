name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild -project Selecta.xcodeproj -scheme Selecta -configuration Debug \
            -derivedDataPath .build/TestDerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES test

      - name: Build Release (ad-hoc signed)
        run: |
          xcodebuild -project Selecta.xcodeproj -scheme Selecta -configuration Release \
            -derivedDataPath .build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          mkdir -p build
          ditto .build/DerivedData/Build/Products/Release/Selecta.app build/Selecta.app
          codesign --verify --deep --strict --verbose=2 build/Selecta.app
          codesign -dv build/Selecta.app 2>&1 | grep -E "Signature|Identifier|TeamIdentifier"

      - name: Package
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Selecta.app/Contents/Info.plist)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent build/Selecta.app "Selecta-$version-adhoc-arm64.zip"
          shasum -a 256 "Selecta-$version-adhoc-arm64.zip" | tee "Selecta-$version-adhoc-arm64.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Selecta-${{ env.VERSION }}-adhoc-arm64
          path: |
            Selecta-*-adhoc-arm64.zip
            Selecta-*-adhoc-arm64.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Selecta-*-adhoc-arm64.zip Selecta-*-adhoc-arm64.zip.sha256 \
            --title "Selecta $GITHUB_REF_NAME" --generate-notes \
            --notes "Ad-hoc signed build for Apple Silicon (macOS 13+). Not notarized: see README for first launch."
