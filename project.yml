name: Selecta
options:
  bundleIdPrefix: org.ra055814ae03f470d982b
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
targets:
  Selecta:
    type: application
    platform: macOS
    sources:
      - path: Selecta
        excludes:
          - '**/__pycache__/**'
          - '**/*.pyc'
      - path: requirements-ocr.lock
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Selecta/Info.plist
      properties:
        CFBundleDisplayName: Selecta
        CFBundleShortVersionString: '0.1.2'
        CFBundleVersion: '3'
        CFBundleIconFile: Selecta.icns
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: Selecta 需要录屏权限以识别选定区域的文字。
        NSHumanReadableCopyright: 'Selecta contributors; derived from Easydict © izual. GPL-3.0.'
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ra055814ae03f470d982b.selecta
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  SelectaTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Selecta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: '14.0'
schemes:
  Selecta:
    build:
      targets:
        Selecta: all
    test:
      targets: [SelectaTests]
